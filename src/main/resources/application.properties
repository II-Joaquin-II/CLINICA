spring.application.name=clinica

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/clinica_db
spring.datasource.username=root
spring.datasource.password=root

# Hibernate
# 'update' hace que Spring cree o actualice las tablas automáticamente según tu código Java
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las consultas SQL que Spring ejecuta por detrás
spring.jpa.show-sql=true